name: Verify Theory of Bounded Existence (Appendix B v1.0)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-lean4-and-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan and build Lean 4 modules (BoundaryVerification & ExistenceVerification)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get || true
          lake build BoundaryVerification ExistenceVerification

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies and run 6-layer verification suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python verification_existence_v1_0.py
