name: Verify Theory of Bounded Existence (Appendix B v1.0)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-lean4-and-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SHA-256 manifest checksums
        run: |
          sha256sum -c MANIFEST_SHA256.txt

      - name: Install elan, build Lean 4 modules, and verify #print axioms output
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get || true
          lake build BoundaryVerification ExistenceVerification | tee lean_build.log
          grep -q "Build completed successfully" lean_build.log
          grep -q "existence_box_8face_nagumo_certificate.*propext.*Classical.choice.*Quot.sound" lean_build.log
          ! grep -q "sorryAx" lean_build.log

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies and run 6-layer verification suite
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python verification_existence_v1_0.py
